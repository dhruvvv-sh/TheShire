<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TheShire — SWRO plant</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">TheShire digital twin</p>
          <h1 id="plant-name">SWRO prototype</h1>
        </div>
        <div class="kpi-row" id="kpi-row"></div>
      </header>

      <div class="workspace">
        <aside class="panel controls">
          <section>
            <h2>Seawater feed</h2>
            <div id="feed-controls"></div>
          </section>
          <section>
            <h2 id="unit-params-title">Unit parameters</h2>
            <p class="hint" id="unit-summary"></p>
            <div id="unit-controls"></div>
          </section>
        </aside>

        <main class="main">
          <section class="panel mimic-panel">
            <div class="panel-head">
              <h2>Process train</h2>
              <p class="hint">Select a unit to inspect internals and edit its model parameters.</p>
            </div>
            <div class="mimic" id="mimic"></div>
          </section>

          <section class="lower">
            <div class="panel">
              <h2 id="internals-title">Unit internals</h2>
              <div class="internals" id="internals"></div>
            </div>
            <div class="panel">
              <h2>Stream table</h2>
              <div class="table-wrap">
                <table id="stream-table"></table>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
